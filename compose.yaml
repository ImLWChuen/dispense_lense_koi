services:
  postgres:
    image: postgres:16-alpine
    container_name: dispenselens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dispenselens
      POSTGRES_USER: dispenselens_user
      POSTGRES_PASSWORD: dispenselens_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispenselens_user -d dispenselens"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
