[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dispense-lense-koi"
version = "0.1.0"
description = "Dispense Lens - AI Dispensing Defect Detective"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["backend"]
extraPaths = [".", "backend"]
pythonpath = ["backend"]